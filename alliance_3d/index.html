<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BNSF Alliance 3D Yard</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>

    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="top" class="glass">
      <button class="ib" id="menu" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <span class="ttl">BNSF Alliance Yard</span>
    </div>

    <div id="sheet" class="glass" role="dialog" aria-label="Map options"></div>

    <div id="ctl">
      <div class="grp glass">
        <button id="compass" aria-label="Reset north">
          <svg viewBox="0 0 24 24">
            <g id="needle">
              <path d="M12 3l3.5 9h-7z" fill="#ff3b30" stroke="none" />
              <path
                d="M12 21l3.5-9h-7z"
                fill="currentColor"
                stroke="none"
                opacity=".45"
              />
            </g>
          </svg>
        </button>
        <button id="tilt" aria-label="Toggle 3D">3D</button>
      </div>
      <div class="grp glass">
        <div id="loco-street-btn" title="Drag onto map for Ground Street View">
          <img src="data/icons/loco_front.svg" alt="BNSF Street View" />
        </div>
      </div>
      <div class="grp glass">
        <button id="zin" aria-label="Zoom in">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="zout" aria-label="Zoom out">
          <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
        </button>
      </div>
      <div class="grp glass">
        <button id="home" aria-label="Whole yard">
          <svg viewBox="0 0 24 24">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Dragging Overlay Avatar -->
    <div id="loco-drag-avatar">
      <img src="data/icons/loco_front.svg" alt="" />
    </div>

    <!-- Ground View Status Pill -->
    <div id="street-view-bar" class="glass">
      <span>Ground Level View</span>
      <button id="exit-street-btn">Exit View</button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
